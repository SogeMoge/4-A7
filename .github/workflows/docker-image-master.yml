name: Docker Image CI

on:
  push:
    branches:
      - master

concurrency:
  group: master-deploy
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules

        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Get short commit SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:8}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: sogemoge/4-a7:${{ env.SHORT_SHA }}, sogemoge/4-a7:latest
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Hacker attack
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd ${{ secrets.REMOTE_TARGET }}
            git checkout master && git stash && git fetch --all && git reset --hard origin/master
            git submodule update --recursive --remote
            export IMAGE_4A7=$(git log -n 1 --pretty=format:"%H" | cut -c1-8)
            sed -i -e "s/latest/${IMAGE_4A7}/g" deploy/docker-compose.yml
            systemctl restart xwsbot.service
